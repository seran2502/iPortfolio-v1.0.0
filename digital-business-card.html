<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Digital Business Card | Seran K UI/UX</title>
  <meta name="description" content="Side Quests Coming Soon">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { min-height: 100vh; display: grid; place-items: center; }
    .coming-soon { width: min(760px, calc(100% - 40px)); text-align: center; padding: 48px 24px; }
    .coming-soon h1 { font-size: clamp(34px, 6vw, 56px); font-weight: 700; margin-bottom: 18px; }
    .coming-soon p { max-width: 650px; margin: 0 auto; font-size: 17px; line-height: 1.8; color: var(--default-color); }
    .back-to-portfolio { display: inline-flex; align-items: center; gap: 9px; margin-top: 30px; padding: 12px 22px; border-radius: 6px; background: var(--accent-color); color: #fff; font-weight: 500; text-decoration: none; transition: .3s; }
    .back-to-portfolio:hover { background: color-mix(in srgb, var(--accent-color), #000 12%); color: #fff; }
  </style>
</head>
<body>
  <main class="coming-soon">
    <h1>Side Quests Coming Soon</h1>
    <p>A collection of experiments, ideas, explorations, and fun creative projects I’m currently working on. More coming soon.</p>
    <a class="back-to-portfolio" href="index.html"><i class="bi bi-arrow-left"></i> Back to Portfolio</a>
  </main>
</body>
</html>
